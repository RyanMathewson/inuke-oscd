<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iNuke Control</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="unsupportedBanner" class="banner" hidden>
  Your browser doesn't support WebHID, so it can't talk to the amp. Use a
  recent desktop <strong>Chrome, Edge, or Opera</strong> (Firefox and Safari
  don't implement WebHID).
</div>

<header class="topbar">
  <h1>iNuke Control</h1>
  <div class="conn">
    <span id="connStatus" class="status status-disconnected">Disconnected</span>
    <button id="btnConnect" class="primary">Connect</button>
    <button id="btnDisconnect" hidden>Disconnect</button>
    <button id="btnResync" hidden>Re-sync</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="setup">Setup</button>
  <button class="tab" data-tab="configuration">Configuration</button>
  <button class="tab" data-tab="crossover">Filter / Crossover</button>
  <button class="tab" data-tab="peq">Parametric EQ</button>
  <button class="tab" data-tab="deq">Dynamic EQ</button>
</nav>

<main id="panels">
  <section id="panel-setup" class="panel active"></section>
  <section id="panel-configuration" class="panel"></section>
  <section id="panel-crossover" class="panel"></section>
  <section id="panel-peq" class="panel"></section>
  <section id="panel-deq" class="panel"></section>
</main>

<div id="log" class="log" aria-live="polite"></div>

<footer class="meterbar" id="meterbar"></footer>

<script type="module" src="src/main.js"></script>
</body>
</html>
